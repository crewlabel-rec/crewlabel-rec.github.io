<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>CREW LABEL</title>
<link href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1C1C1E;--bg2:#232325;--bg3:#2a2a2d;
  --card:#252528;--card-hover:#2e2e32;--card-selected:#2b3440;
  --border:rgba(255,255,255,0.07);--border-sel:#7A92A5;
  --text:#F3F3F1;--text-muted:rgba(243,243,241,0.75);--text-dim:rgba(243,243,241,0.5);
  --accent:#7A92A5;--accent2:#C48A5A;
  --risk-low:#6a9f7a;--risk-mid:#c4a25a;--risk-high:#c47a7a;
  --font-u:'SUIT',sans-serif;--font-o:'Pretendard',sans-serif;
  --radius:14px;--radius-sm:10px;
  --tr:0.28s cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-u);-webkit-font-smoothing:antialiased;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.5s ease;padding:48px 48px}
.screen.active{opacity:1;pointer-events:all}

/* WELCOME */
#welcome .logo{font-family:var(--font-o);font-size:13px;font-weight:500;letter-spacing:0.3em;color:var(--text-dim);margin-bottom:64px;text-transform:uppercase}
#welcome .headline{font-size:30px;font-weight:300;line-height:1.65;text-align:center;color:var(--text);max-width:620px;margin-bottom:24px}
#welcome .sub{font-size:17px;font-weight:300;line-height:1.8;text-align:center;color:var(--text-muted);max-width:520px;margin-bottom:72px}
#welcome .start-btn{background:none;border:none;color:var(--accent);font-family:var(--font-u);font-size:17px;font-weight:400;letter-spacing:0.08em;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0;transition:opacity var(--tr);-webkit-tap-highlight-color:transparent}
#welcome .start-btn:active{opacity:0.6}

/* INFO */
#info{justify-content:flex-start;padding:0;overflow:hidden}
.info-wrap{width:100%;height:100%;overflow-y:auto;padding:60px 48px 60px;display:flex;flex-direction:column;align-items:center}
.info-logo{font-family:var(--font-o);font-size:13px;font-weight:500;letter-spacing:0.3em;color:var(--text-dim);margin-bottom:48px;text-transform:uppercase}
.info-title{font-size:26px;font-weight:300;color:var(--text);margin-bottom:12px;text-align:center}
.info-sub{font-size:15px;font-weight:300;color:var(--text-muted);line-height:1.8;text-align:center;margin-bottom:44px}
.info-fields{width:100%;max-width:580px;display:flex;flex-direction:column;gap:22px;margin-bottom:40px}
.info-field{display:flex;flex-direction:column;gap:8px}
.info-label{font-family:var(--font-o);font-size:12px;font-weight:500;letter-spacing:0.15em;color:var(--text-dim);text-transform:uppercase}
.info-input{background:var(--bg3);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);padding:16px 20px;font-family:var(--font-u);font-size:17px;font-weight:300;color:var(--text);outline:none;transition:border-color var(--tr);-webkit-appearance:none;width:100%}
.info-input::placeholder{color:rgba(243,243,241,0.3)}
.info-input:focus{border-color:rgba(122,146,165,0.5)}
.gender-btns{display:flex;gap:12px}
.gender-btn{flex:1;background:var(--bg3);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);padding:16px;font-family:var(--font-u);font-size:16px;font-weight:400;color:var(--text-muted);cursor:pointer;transition:background var(--tr),border-color var(--tr),color var(--tr);-webkit-tap-highlight-color:transparent}
.gender-btn.selected{background:var(--card-selected);border-color:var(--border-sel);color:var(--text)}
.info-next-btn{width:100%;max-width:580px;background:none;border:1px solid rgba(122,146,165,0.35);border-radius:var(--radius-sm);color:var(--accent);font-family:var(--font-u);font-size:16px;font-weight:400;padding:18px;cursor:pointer;letter-spacing:0.04em;transition:background var(--tr),opacity var(--tr);-webkit-tap-highlight-color:transparent}
.info-next-btn:hover{background:rgba(122,146,165,0.08)}
.info-next-btn:active{opacity:0.7}

/* QUESTION */
#question{justify-content:center;padding:48px;overflow-y:auto}
.q-top{width:100%;max-width:980px;margin-bottom:36px;flex-shrink:0}
.q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.q-num{font-family:var(--font-o);font-size:13px;font-weight:500;letter-spacing:0.25em;color:var(--text-dim);text-transform:uppercase}
.q-count{font-family:var(--font-o);font-size:13px;color:var(--text-dim)}
.progress-bar{width:100%;height:1px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);opacity:0.7}
.q-text{width:100%;max-width:980px;font-size:22px;font-weight:300;line-height:1.75;color:var(--text);margin-bottom:36px;flex-shrink:0}
.cards{width:100%;max-width:980px;display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:22px 26px;font-size:17px;font-weight:400;line-height:1.4;color:rgba(243,243,241,0.92);cursor:pointer;transition:background var(--tr),border-color var(--tr),color var(--tr);-webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:clip}
.card:hover{background:var(--card-hover)}
.card.selected{background:var(--card-selected);border-color:var(--border-sel);color:var(--text)}
.next-btn{width:100%;max-width:980px;background:none;border:1px solid rgba(122,146,165,0.3);border-radius:var(--radius-sm);color:var(--accent);font-family:var(--font-u);font-size:16px;font-weight:400;padding:18px;cursor:pointer;transition:background var(--tr),opacity var(--tr);letter-spacing:0.04em;margin-bottom:40px;-webkit-tap-highlight-color:transparent;opacity:0;pointer-events:none}
.next-btn.visible{opacity:1;pointer-events:all}
.next-btn:hover{background:rgba(122,146,165,0.08)}
.next-btn:active{opacity:0.7}

/* COMPLETION */
#completion .check-mark{width:64px;height:64px;border:1px solid rgba(122,146,165,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:48px;color:var(--accent);font-size:26px}
#completion .headline{font-size:28px;font-weight:300;text-align:center;margin-bottom:16px}
#completion .sub{font-size:17px;font-weight:300;line-height:1.8;text-align:center;color:var(--text-muted);max-width:440px}
#completion .op-hint{font-size:12px;color:var(--text-dim);margin-top:48px;letter-spacing:0.1em;cursor:default;-webkit-tap-highlight-color:transparent;user-select:none}

/* OP TRIGGER */
#op-trigger{position:fixed;top:0;right:0;width:80px;height:80px;z-index:9999;cursor:default;-webkit-tap-highlight-color:transparent;display:none}

/* OPERATOR */
#operator{font-family:var(--font-o);justify-content:flex-start;padding:0;overflow:hidden}
.op-inner{width:100%;height:100%;overflow-y:auto;padding:44px 32px 60px}
.op-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.op-logo{font-size:10px;font-weight:600;letter-spacing:0.35em;color:var(--text-dim);text-transform:uppercase}
.op-badge{font-size:10px;letter-spacing:0.2em;color:var(--accent2);border:1px solid rgba(196,138,90,0.25);border-radius:4px;padding:4px 10px;text-transform:uppercase}

/* APPLICANT CARD */
.applicant-card{background:var(--bg3);border:1px solid rgba(122,146,165,0.2);border-radius:var(--radius);padding:16px 18px;margin-bottom:28px}
.applicant-main{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.applicant-avatar{width:42px;height:42px;border-radius:50%;background:rgba(122,146,165,0.15);border:1px solid rgba(122,146,165,0.3);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;color:var(--accent);flex-shrink:0}
.applicant-name{font-size:17px;font-weight:500;color:var(--text);margin-bottom:4px}
.applicant-meta{font-size:12px;color:var(--text-muted)}
.applicant-contact{font-size:12px;color:var(--text-dim);padding-left:56px}

/* SUMMARY STRIP */
.summary-strip{display:flex;gap:6px;margin-bottom:32px;flex-wrap:wrap}
.strip-item{flex:1;min-width:52px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center}
.strip-qnum{font-size:9px;color:var(--text-dim);letter-spacing:0.15em;margin-bottom:5px}
.strip-code{font-size:17px;font-weight:600}
.code-a{color:#7A92A5}.code-b{color:#8fa89c}.code-c{color:#a89e8a}.code-d{color:#c0957a}.code-e{color:#c47a7a}

/* OP SECTIONS */
.op-section{margin-bottom:28px}
.op-section-title{font-size:10px;font-weight:600;letter-spacing:0.25em;color:var(--text-dim);text-transform:uppercase;margin-bottom:14px}

/* POS BARS */
.pos-bars{display:flex;flex-direction:column;gap:10px}
.pos-row{display:flex;align-items:center;gap:12px}
.pos-label{font-size:12px;color:var(--text-muted);width:60px;flex-shrink:0}
.pos-bar-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pos-bar-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.pos-bar-fill.attack{background:#7A92A5}
.pos-bar-fill.defense{background:#8fa89c}
.pos-bar-fill.control{background:#c4a25a}
.pos-bar-fill.observe{background:#a88ec4}
.pos-pct{font-size:12px;font-weight:500;width:34px;text-align:right;flex-shrink:0}

/* RISK */
.risk-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px}
.risk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.risk-label{font-size:13px;color:var(--text-muted)}
.risk-pct-text{font-size:20px;font-weight:600}
.risk-low-color{color:var(--risk-low)}.risk-mid-color{color:var(--risk-mid)}.risk-high-color{color:var(--risk-high)}
.risk-bar-wrap{width:100%;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:8px}
.risk-bar-fill{height:100%;border-radius:2px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.risk-desc{font-size:11px;color:var(--text-dim)}

/* TRAIT TAGS */
.trait-tags{display:flex;flex-wrap:wrap;gap:8px}
.trait-tag{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:13px;color:rgba(243,243,241,0.9)}
.trait-tag.accent{border-color:rgba(122,146,165,0.4);color:#a8c4d8}

/* CHECK LIST */
.check-list{display:flex;flex-direction:column;gap:8px}
.check-item{background:var(--bg3);border:1px solid var(--border);border-left:2px solid rgba(196,138,90,0.7);border-radius:0 8px 8px 0;padding:12px 16px;font-size:13px;color:rgba(243,243,241,0.9);line-height:1.6}

/* EXPLORE */
.risk-explore{display:flex;flex-direction:column;gap:24px}
.explore-category{border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
.explore-category-header{padding:16px 20px;background:rgba(196,122,122,0.1);border-bottom:1px solid rgba(196,122,122,0.15);display:flex;align-items:center;justify-content:space-between}
.explore-category-title{font-size:14px;font-weight:600;color:#e8a8a8;letter-spacing:0.05em}
.explore-category-score{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.explore-category-body{background:var(--bg3);display:flex;flex-direction:column}
.explore-card{border-bottom:1px solid rgba(255,255,255,0.05)}
.explore-card:last-child{border-bottom:none}
.explore-q{padding:16px 20px 10px;font-size:14px;color:var(--text);line-height:1.65;font-weight:500}
.explore-q-num{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.15em;color:#e8a8a8;background:rgba(196,122,122,0.15);padding:2px 8px;border-radius:4px;margin-bottom:8px;text-transform:uppercase}
.explore-answers{padding:4px 20px 16px;display:flex;flex-direction:column;gap:6px}
.explore-ans{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:all var(--tr);-webkit-tap-highlight-color:transparent}
.explore-ans:hover{background:rgba(255,255,255,0.04)}
.explore-ans.selected-ok{background:rgba(106,159,122,0.15);border-color:rgba(106,159,122,0.4)}
.explore-ans.selected-mid{background:rgba(196,162,90,0.15);border-color:rgba(196,162,90,0.4)}
.explore-ans.selected-bad{background:rgba(196,122,122,0.15);border-color:rgba(196,122,122,0.4)}
.explore-ans-text{font-size:13px;color:rgba(243,243,241,0.85);line-height:1.5;flex:1}
.explore-verdict{font-size:11px;padding:4px 10px;border-radius:6px;flex-shrink:0;font-weight:500;white-space:nowrap}
.verdict-ok{background:rgba(106,159,122,0.15);color:#7ec49a}
.verdict-mid{background:rgba(196,162,90,0.15);color:#d4b06a}
.verdict-bad{background:rgba(196,122,122,0.15);color:#e89090}

/* REC LIST */
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:13px;color:rgba(243,243,241,0.85);line-height:1.7;font-style:italic}

/* Q DETAIL */
.q-detail-list{display:flex;flex-direction:column;gap:10px}
.q-detail-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.q-detail-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.q-detail-num{font-size:10px;color:var(--text-dim);letter-spacing:0.15em}
.q-detail-sel{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.q-detail-text{font-size:12px;color:rgba(243,243,241,0.88);line-height:1.6;margin-bottom:5px}
.q-detail-intent{font-size:11px;color:rgba(243,243,241,0.6);line-height:1.5}

.divider{height:1px;background:var(--border);margin:28px 0}

/* BUTTONS */
.op-back{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-family:var(--font-o);font-size:12px;padding:12px 20px;cursor:pointer;letter-spacing:0.08em;transition:border-color var(--tr),color var(--tr);margin-top:8px;-webkit-tap-highlight-color:transparent}
.op-back:hover{border-color:var(--accent);color:var(--accent)}
.op-save-btn{background:rgba(122,146,165,0.12);border:1px solid rgba(122,146,165,0.4);border-radius:8px;color:var(--accent);font-family:var(--font-o);font-size:12px;padding:12px 24px;cursor:pointer;letter-spacing:0.08em;transition:background var(--tr),opacity var(--tr);-webkit-tap-highlight-color:transparent;font-weight:500}
.op-save-btn:hover{background:rgba(122,146,165,0.2)}
.op-save-btn:active{opacity:0.7}
.op-save-btn.saving{opacity:0.5;pointer-events:none}
.op-save-btn.saved{background:rgba(106,159,122,0.15);border-color:rgba(106,159,122,0.4);color:var(--risk-low);pointer-events:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.45s ease both}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div class="logo">Crew Label</div>
  <div class="headline">당신이 가장 빛나는 자리를<br>찾기 위한 질문입니다.</div>
  <div class="sub">이 설문지는 크루레이블 팀 구성에서<br>본인의 성향과 포지션을 파악하기 위한 것으로,<br>더 좋은 팀워크와 더 사랑받는 방송을<br>만들기 위한 과정입니다.<br><br>정답은 없습니다.<br>지금의 본인과 가장 가까운 답을 편하게 골라주세요.</div>
  <button class="start-btn" onclick="showScreen('info')">시작하기 <span>→</span></button>
</div>

<!-- INFO -->
<div id="info" class="screen">
  <div class="info-wrap">
    <div class="info-logo">Crew Label</div>
    <div class="info-title">기본 정보를 입력해 주세요</div>
    <div class="info-sub">입력하신 정보는 팀 구성에만 활용되며<br>외부에 공개되지 않습니다.</div>
    <div class="info-fields">
      <div class="info-field">
        <label class="info-label">이름</label>
        <input class="info-input" id="f-name" type="text" placeholder="이름">
      </div>
      <div class="info-field">
        <label class="info-label">나이</label>
        <input class="info-input" id="f-age" type="number" placeholder="예) 28">
      </div>
      <div class="info-field">
        <label class="info-label">성별</label>
        <div class="gender-btns">
          <button class="gender-btn" id="g-male" onclick="selectGender('남성')">남성</button>
          <button class="gender-btn" id="g-female" onclick="selectGender('여성')">여성</button>
        </div>
      </div>
      <div class="info-field">
        <label class="info-label">직업 / 활동 분야</label>
        <input class="info-input" id="f-job" type="text" placeholder="예) 직장인, 연기 지망생, 프리랜서 등">
      </div>
      <div class="info-field">
        <label class="info-label">연락처</label>
        <input class="info-input" id="f-contact" type="tel" placeholder="010-0000-0000">
      </div>
    </div>
    <button class="info-next-btn" onclick="submitInfo()">다음으로 →</button>
  </div>
</div>

<!-- QUESTION -->
<div id="question" class="screen">
  <div class="q-top">
    <div class="q-meta">
      <span class="q-num" id="q-num-label">Question 01</span>
      <span class="q-count" id="q-count-label">1 / 10</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="cards" id="cards-container"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음으로</button>
</div>

<!-- COMPLETION -->
<div id="completion" class="screen">
  <div class="check-mark">✓</div>
  <div class="headline">답변 감사합니다.</div>
  <div class="sub">이제 신PD님과 조금 더<br>편하게 이야기 나눠볼게요 :)</div>
  <div class="op-hint" id="op-hint">CREW LABEL</div>
</div>

<!-- OPERATOR -->
<div id="operator" class="screen">
  <div class="op-inner" id="op-inner"></div>
</div>

<!-- HIDDEN TRIGGER -->
<div id="op-trigger"></div>

<script>
var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxetxDjlKJ6D1e156mVC5CIWrn3AAEO4Bt0nJXeUrvaiXRWiidfQufbEb-x1sZEy6am/exec';

var Q = [
  {id:1,text:"살면서 가끔은 사람들이 나를 오해하는 순간이 있을 수 있어요. 보통 어떻게 오해하고 왜 그런 오해가 생겼을까요?",intent:"자기객관화 여부 / 타인 해석 방향 / 관계 민감도 / 피해의식 가능성",answers:[

function selectGender(g) {
  selectedGender = g;

  document.getElementById('g-female').classList.toggle('selected', g==='여성');
}

function submitInfo() {
  var name = document.getElementById('f-name').value.trim();
  var age = document.getElementById('f-age').value.trim();
  var job = document.getElementById('f-job').value.trim();
  var contact = document.getElementById('f-contact').value.trim();
  if(!name){ alert('이름을 입력해 주세요.'); return; }
  if(!age){ alert('나이를 입력해 주세요.'); return; }

  applicantInfo = {name:name, age:age, gender:selectedGender, job:job, contact:contact};

}

function shuffle(arr) {
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

Q.forEach(function(q){ shuffledOrders.push(shuffle(q.answers)); });

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.getElementById('op-trigger').style.display = (id==='completion') ? 'block' : 'none';
}

function startQuestions() {
  currentQ = 0;
  renderQ();
  showScreen('question');
}

function renderQ() {
  var q = Q[currentQ];
  var shuffled = shuffledOrders[currentQ];
  document.getElementById('q-num-label').textContent = 'Question ' + String(currentQ+1).padStart(2,'0');
  document.getElementById('q-count-label').textContent = (currentQ+1) + ' / 10';
  document.getElementById('progress-fill').style.width = (currentQ/10*100) + '%';
  var qEl = document.getElementById('q-text');
  qEl.style.animation='none'; qEl.offsetHeight;
  qEl.textContent = q.text;
  qEl.style.animation='fadeUp 0.4s ease both';
  var container = document.getElementById('cards-container');
  container.innerHTML=''; container.style.animation='none'; container.offsetHeight;
  container.style.animation='fadeUp 0.45s ease 0.05s both';
  shuffled.forEach(function(ans){
    var card = document.createElement('div');
    card.className = 'card';
    card.textContent = ans.text;
    card.dataset.code = ans.code;
    if(answers[currentQ]===ans.code) card.classList.add('selected');
    card.addEventListener('click', function(){
      container.querySelectorAll('.card').forEach(function(c){ c.classList.remove('selected'); });
      card.classList.add('selected');
      answers[currentQ] = ans.code;
      document.getElementById('next-btn').classList.add('visible');
    });
    container.appendChild(card);
  });
  document.getElementById('next-btn').classList.toggle('visible', answers[currentQ]!==null);
  document.getElementById('question').scrollTop = 0;
}

function nextQuestion() {
  if(answers[currentQ]===null) return;
  currentQ++;
  if(currentQ>=10){ showScreen('completion'); return; }
  renderQ();
}

var tapCount = 0;

var hint = document.getElementById('op-hint');
if(hint) {
  hint.addEventListener('click', function() {
    tapCount++;
    clearTimeout(tapTimer);
    if(tapCount >= 5) {
      tapCount = 0;
      renderOperator();
      showScreen('operator');
    } else {
      tapTimer = setTimeout(function(){ tapCount = 0; }, 1500);
    }
  });
}

function calcScores() {
  var pos = {attack:0,defense:0,control:0,observe:0};
  var riskRaw = 0;
  var riskTypes = {};
  answers.forEach(function(code,i){
    if(!code) return;
    var ans = Q[i].answers.find(function(a){ return a.code===code; });
    if(!ans) return;
    pos.attack += ans.pos.attack;
    pos.defense += ans.pos.defense;
    pos.control += ans.pos.control;
    pos.observe += ans.pos.observe;
    riskRaw += ans.risk||0;
    if(ans.riskType) riskTypes[ans.riskType] = (riskTypes[ans.riskType]||0) + (ans.risk||0);
  });
  var total = pos.attack+pos.defense+pos.control+pos.observe||1;
  var posPct = {
    attack: Math.round(pos.attack/total*100),
    defense: Math.round(pos.defense/total*100),
    control: Math.round(pos.control/total*100),
    observe: Math.round(pos.observe/total*100)
  };
  var riskPct = Math.min(Math.round(riskRaw/125*100),100);
  var traits = [];
  if(posPct.attack>=30) traits.push({text:'공격형 — 분위기 리드 가능성',accent:true});
  if(posPct.defense>=30) traits.push({text:'수비형 — 리액션 케미 가능성',accent:true});
  if(posPct.control>=30) traits.push({text:'컨트롤형 — 팀 안정 가능성',accent:true});
  if(posPct.observe>=25) traits.push({text:'관찰형 — 분위기 파악형',accent:false});
  var ansAB = answers.filter(function(c){ return c==='A'||c==='B'; }).length;
  if(ansAB>=7) traits.push({text:'전반적 적응력 높음',accent:true});
  if(traits.length===0) traits.push({text:'유동형 — 추가 탐색 필요',accent:false});
  var checks = [];
  answers.forEach(function(code,i){
    if(!code) return;
    var ans = Q[i].answers.find(function(a){ return a.code===code; });
    if(ans&&ans.risk>0) checks.push('Q'+String(i+1).padStart(2,'0')+' — '+ans.trait);
  });
  if(checks.length===0) checks.push('현재 단계에서 특별히 체크할 포인트 없음');
  var exploreTypes = Object.entries(riskTypes).filter(function(e){ return e[1]>=10; }).sort(function(a,b){ return b[1]-a[1]; }).map(function(e){ return e[0]; });
  return {posPct:posPct, riskPct:riskPct, riskTypes:riskTypes, traits:traits, checks:checks, exploreTypes:exploreTypes};
}

function saveToSheets() {
  var btn = document.getElementById('save-btn');
  if(!btn) return;
  var sc = calcScores();

  function getExploreLabel(type, qi) {
    var sel = exploreSelections[type] && exploreSelections[type][qi];
    return sel || '';
  }

  var payload = {
    name:applicantInfo.name||'',age:applicantInfo.age||'',gender:applicantInfo.gender||'',
    job:applicantInfo.job||'',contact:applicantInfo.contact||'',
    q01:answers[0]||'',q02:answers[1]||'',q03:answers[2]||'',q04:answers[3]||'',q05:answers[4]||'',
    q06:answers[5]||'',q07:answers[6]||'',q08:answers[7]||'',q09:answers[8]||'',q10:answers[9]||'',
    attack:sc.posPct.attack,defense:sc.posPct.defense,control:sc.posPct.control,observe:sc.posPct.observe,risk:sc.riskPct,
    피해의식_Q1:getExploreLabel('피해의식',0),
    피해의식_Q2:getExploreLabel('피해의식',1),
    감정누적_Q1:getExploreLabel('감정누적',0),
    감정누적_Q2:getExploreLabel('감정누적',1),
    과해석_Q1:getExploreLabel('과해석',0),
    과해석_Q2:getExploreLabel('과해석',1),
    악플내성_Q1:getExploreLabel('악플민감',0),
    악플내성_Q2:getExploreLabel('악플민감',1),
    단절형_Q1:getExploreLabel('단절형',0),
    단절형_Q2:getExploreLabel('단절형',1),
    인정욕구_Q1:getExploreLabel('인정욕구',0),
    인정욕구_Q2:getExploreLabel('인정욕구',1)
  };
  btn.textContent = '저장 중...';
  btn.classList.add('saving');
  fetch(SHEETS_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).then(function(){
    btn.textContent = '✓ 저장 완료';
    btn.classList.remove('saving');
    btn.classList.add('saved');
  }).catch(function(){
    btn.textContent = '저장 실패 — 다시 시도';
    btn.classList.remove('saving');
  });
}

function el(tag,cls){ var e=document.createElement(tag); if(cls)e.className=cls; return e; }
function div(parent){ parent.appendChild(el('div','divider')); }
function addSectionTitle(parent,text){ var t=el('div','op-section-title'); t.textContent=text; parent.appendChild(t); }

function renderOperator() {
  var inner = document.getElementById('op-inner');
  inner.innerHTML = '';
  var sc = calcScores();

  // header
  var hdr = el('div','op-header fade-up');
  hdr.innerHTML = '<div class="op-logo">Crew Label</div><div class="op-badge">Operator Mode</div>';
  inner.appendChild(hdr);

  // applicant card
  var infoCard = el('div','applicant-card fade-up');
  var avatarChar = applicantInfo.name ? applicantInfo.name[0] : '?';
  var metaParts = [];
  if(applicantInfo.age) metaParts.push(applicantInfo.age+'세');
  if(applicantInfo.gender) metaParts.push(applicantInfo.gender);
  if(applicantInfo.job) metaParts.push(applicantInfo.job);
  infoCard.innerHTML = '<div class="applicant-main"><div class="applicant-avatar">'+avatarChar+'</div><div class="applicant-info"><div class="applicant-name">'+(applicantInfo.name||'—')+'</div><div class="applicant-meta">'+metaParts.join(' · ')+'</div></div></div><div class="applicant-contact">'+(applicantInfo.contact||'—')+'</div>';
  inner.appendChild(infoCard);

  // summary strip
  var strip = el('div','summary-strip fade-up');
  answers.forEach(function(code,i){
    var item = el('div','strip-item');
    item.innerHTML = '<div class="strip-qnum">Q'+String(i+1).padStart(2,'0')+'</div><div class="strip-code '+(code?'code-'+code.toLowerCase():'')+'">'+(code||'?')+'</div>';
    strip.appendChild(item);
  });
  inner.appendChild(strip);
  div(inner);

  // position
  addSectionTitle(inner,'포지션 가능성');
  var posWrap = el('div','pos-bars op-section');
  [{key:'attack',label:'공격형',cls:'attack'},{key:'defense',label:'수비형',cls:'defense'},{key:'control',label:'컨트롤형',cls:'control'},{key:'observe',label:'관찰형',cls:'observe'}].forEach(function(p){
    var row = el('div','pos-row');
    var pct = sc.posPct[p.key];
    row.innerHTML = '<span class="pos-label">'+p.label+'</span><div class="pos-bar-wrap"><div class="pos-bar-fill '+p.cls+'" style="width:'+pct+'%"></div></div><span class="pos-pct">'+pct+'%</span>';
    posWrap.appendChild(row);
  });
  inner.appendChild(posWrap);
  div(inner);

  // risk
  addSectionTitle(inner,'리스크 지수');
  var riskSec = el('div','op-section');
  var rColor = sc.riskPct<30?'risk-low-color':sc.riskPct<60?'risk-mid-color':'risk-high-color';
  var rBarColor = sc.riskPct<30?'#6a9f7a':sc.riskPct<60?'#c4a25a':'#c47a7a';
  var rDesc = sc.riskPct<30?'추가 탐색 질문 없음 — 자연스럽게 대화 진행':sc.riskPct<60?'일부 탐색 질문 확인 권장':'아래 탐색 질문 전체 확인 필요';
  var rWrap = el('div','risk-wrap');
  rWrap.innerHTML = '<div class="risk-top"><span class="risk-label">리스크 지수</span><span class="risk-pct-text '+rColor+'">'+sc.riskPct+'%</span></div><div class="risk-bar-wrap"><div class="risk-bar-fill" style="width:'+sc.riskPct+'%;background:'+rBarColor+'"></div></div><div class="risk-desc">'+rDesc+'</div>';
  riskSec.appendChild(rWrap);
  inner.appendChild(riskSec);
  div(inner);

  // traits
  addSectionTitle(inner,'관계 · 방송 성향');
  var traitSec = el('div','op-section');
  var traitWrap = el('div','trait-tags');
  sc.traits.forEach(function(t){
    var tag = el('span','trait-tag'+(t.accent?' accent':''));
    tag.textContent = t.text;
    traitWrap.appendChild(tag);
  });
  traitSec.appendChild(traitWrap);
  inner.appendChild(traitSec);
  div(inner);

  // checks
  addSectionTitle(inner,'⚠ 체크 포인트');
  var checkSec = el('div','op-section');
  var checkList = el('div','check-list');
  sc.checks.forEach(function(c){
    var item = el('div','check-item');
    item.textContent = c;
    checkList.appendChild(item);
  });
  checkSec.appendChild(checkList);
  inner.appendChild(checkSec);

  // explore — 모든 유형 항상 표시, 카테고리별 묶음, 토글 선택
  div(inner);
  addSectionTitle(inner,'추가 탐색 질문');
  var exploreSec = el('div','op-section');
  var exploreWrap = el('div','risk-explore');

  var allTypes = ['피해의식','감정누적','과해석','악플민감','단절형','인정욕구'];
  allTypes.forEach(function(type){
    var data = EXPLORE[type];
    if(!data) return;
    var catScore = sc.riskTypes[type] || 0;

    var category = el('div','explore-category');

    // 헤더
    var catHeader = el('div','explore-category-header');
    var catTitle = el('div','explore-category-title');
    catTitle.textContent = data.title;
    var catBadge = el('div','explore-category-score '+(catScore>=20?'verdict-bad':catScore>=10?'verdict-mid':'verdict-ok'));
    catBadge.textContent = catScore > 0 ? '탐색 필요' : '해당 없음';
    catHeader.appendChild(catTitle);
    catHeader.appendChild(catBadge);
    category.appendChild(catHeader);

    // 질문들
    var catBody = el('div','explore-category-body');
    data.questions.forEach(function(q, qi){
      var card = el('div','explore-card');

      var qDiv = el('div','explore-q');
      var qNum = el('div','explore-q-num');
      qNum.textContent = 'Q' + (qi+1);
      qDiv.appendChild(qNum);
      qDiv.appendChild(document.createTextNode(q.q));
      card.appendChild(qDiv);

      var ansWrap = el('div','explore-answers');
      q.answers.forEach(function(a){
        var row = el('div','explore-ans');
        var vClass = a.verdict==='ok'?'verdict-ok':a.verdict==='mid'?'verdict-mid':'verdict-bad';
        row.innerHTML = '<div class="explore-ans-text">'+a.text+'</div><div class="explore-verdict '+vClass+'">'+a.label+'</div>';

        // 토글 선택
        (function(rowEl, typeKey, qIdx, ansLabel, ansVerdict){
          rowEl.addEventListener('click', function(){
            ansWrap.querySelectorAll('.explore-ans').forEach(function(r){
              r.classList.remove('selected-ok','selected-mid','selected-bad');
            });
            if(exploreSelections[typeKey][qIdx] === ansLabel) {
              exploreSelections[typeKey][qIdx] = null;
            } else {
              rowEl.classList.add('selected-'+ansVerdict);
              exploreSelections[typeKey][qIdx] = ansLabel;
            }
          });
          if(exploreSelections[typeKey][qIdx] === ansLabel) {
            rowEl.classList.add('selected-'+ansVerdict);
          }
        })(row, type, qi, a.label, a.verdict);

        ansWrap.appendChild(row);
      });
      card.appendChild(ansWrap);
      catBody.appendChild(card);
    });
    category.appendChild(catBody);
    exploreWrap.appendChild(category);
  });

  exploreSec.appendChild(exploreWrap);
  inner.appendChild(exploreSec);

  div(inner);

  // detail
  addSectionTitle(inner,'질문별 선택 상세');
  var detailSec = el('div','op-section');
  var detailList = el('div','q-detail-list');
  Q.forEach(function(q,i){
    var code = answers[i];
    var ans = q.answers.find(function(a){ return a.code===code; });
    var item = el('div','q-detail-item');
    var selClass = code==='E'?'code-e':code==='D'?'code-d':code==='C'?'code-c':code==='B'?'code-b':'code-a';
    item.innerHTML = '<div class="q-detail-top"><span class="q-detail-num">Q'+String(i+1).padStart(2,'0')+'</span><span class="q-detail-sel '+selClass+'">'+(code||'?')+'</span></div><div class="q-detail-text">'+(ans?ans.text:'미응답')+'</div><div class="q-detail-intent">'+(ans?ans.trait:'')+'</div>';
    detailList.appendChild(item);
  });
  detailSec.appendChild(detailList);
  inner.appendChild(detailSec);
  div(inner);

  // buttons
  var btnRow = el('div','');
  btnRow.style.cssText = 'display:flex;gap:10px;margin-top:8px;';
  var back = el('button','op-back');
  back.textContent = '← 신청자 화면으로';
  back.addEventListener('click', function(){ showScreen('completion'); });
  var saveBtn = el('button','op-save-btn');
  saveBtn.id = 'save-btn';
  saveBtn.textContent = '구글 시트에 저장';
  saveBtn.addEventListener('click', saveToSheets);
  btnRow.appendChild(back);
  btnRow.appendChild(saveBtn);
  inner.appendChild(btnRow);
}

showScreen('welcome');

// 전체화면 자동 실행
document.addEventListener('click', function fullscreenOnce() {
  if(!document.fullscreenElement) {
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  document.removeEventListener('click', fullscreenOnce);
}, {once: true});
</script>
</body>
</html>
